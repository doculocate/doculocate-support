name: Bug report
description: Report a reproducible problem with DocuLocate.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Use fictional samples. Do not include confidential documents, API keys, private URLs, or unsanitized logs."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include file format and approximate size when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a sanitized error message if available.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App version or commit, OS, browser, Node.js version, and reranking provider (no keys).
    validations:
      required: true
